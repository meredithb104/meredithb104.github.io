<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Public Sans"; font-weight: 100 900; src: url("../../public/fonts/public-sans-latin.woff2") format("woff2"); }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #14224A; color: #F4F1E8; font-family: "Public Sans", system-ui, sans-serif; position: relative; overflow: hidden; }
  .rule { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #A9C1E8; }
  .inner { position: absolute; left: 102px; top: 76px; right: 80px; }
  .eyebrow { color: #DCD6C2; font-weight: 600; font-size: 24px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 22px; }
  h1 { font-weight: 700; font-size: 66px; line-height: 1.08; letter-spacing: -0.01em; margin: 0; max-width: 900px; }
  .pills { display: flex; gap: 14px; margin-top: 78px; }
  .pill { border: 2px solid #8390B4; border-radius: 999px; padding: 10px 22px; font-size: 24px; white-space: nowrap; }
  .foot { margin-top: 36px; color: #A9C1E8; font-size: 28px; }
</style>
</head>
<body>
  <div class="rule"></div>
  <div class="inner">
    <p class="eyebrow">Accessibility engineer &amp; SME · Front-end developer · Boston, MA</p>
    <h1>I build software and systems where the only path is an accessible path</h1>
    <div class="pills"><span class="pill">WCAG 2.2</span><span class="pill">Section 508</span><span class="pill">JAWS</span><span class="pill">TypeScript</span><span class="pill">React</span><span class="pill">HTML &amp; CSS</span></div>
    <p class="foot">Meredith Boyce · meredithb104.github.io</p>
  </div>
</body>
</html>
